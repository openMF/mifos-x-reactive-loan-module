spring.application.name=loan-risk-microservice

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/loanrisk
spring.r2dbc.username=mifos
spring.r2dbc.password=password
spring.data.r2dbc.repositories.enabled=true
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.max-size=20
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.url=jdbc:postgresql://localhost:5432/loanrisk
spring.liquibase.user=mifos
spring.liquibase.password=password

#kafka
spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topic=external-events
spring.kafka.consumer.group-id=loan-event-ingestor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.admin.auto-create=true

# fineract
#fineract:
#base-url: https://fineract.example.com
#username: api-user
#password: s3cr3t
#connect-timeout: 5s
#read-timeout: 10s
fineract.base-url=https://localhost:8443/fineract-provider/api/v1
fineract.username=mifos
fineract.password=password
# Connect timeout and read timeout for Fineract API
fineract.connect-timeout=5s
fineract.read-timeout=10s
fineract.tenant-id=default

#logging
logging.level.reactor.netty.http.client=DEBUG

# Toggle: trust every certificate in DEV (env var overrides this)
fineract.ssl.trust-all=${FINERACT_SSL_TRUST_ALL:false}

# External risk service configuration
# Which provider implementation to use for bank statement analysis
bsa.provider=arya
# Base URL for Arya's bank statement analysis API
bsa.arya.base-url=https://ping.arya.ai/api/v1
# Token is expected via environment variable or external configuration:
bsa.arya.token=<secret>
